name: Production VPS Automated CI/CD Deployment

on:
  push:
    branches:
      - main

concurrency:
  group: production-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Execute Production Release & Atomic Deployment on VPS
        if: ${{ secrets.VPS_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '169.58.111.159' }}
          username: ${{ secrets.VPS_USERNAME || 'altrixadmin' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            sudo /opt/altrix/scripts/deploy.sh "${{ github.sha }}"
