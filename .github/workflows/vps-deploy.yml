name: Production VPS Automated CI/CD Deployment

on:
  push:
    branches:
      - main

concurrency:
  group: production-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Execute Production Release & Atomic Deployment on VPS
        if: env.VPS_SSH_KEY != ''
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '169.58.111.159' }}
          username: ${{ secrets.VPS_USERNAME || 'altrixadmin' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo cp -p /opt/altrix/repo/scripts/deploy.sh /opt/altrix/scripts/deploy.sh 2>/dev/null || sudo cp -p /opt/altrix/repo/scripts/deploy_vps.sh /opt/altrix/scripts/deploy.sh 2>/dev/null || true
            sudo chmod +x /opt/altrix/scripts/deploy.sh 2>/dev/null || true
            sudo /opt/altrix/scripts/deploy.sh "${{ github.sha }}"
