name: Production VPS Automated CI/CD Deployment

on:
  push:
    branches:
      - main

concurrency:
  group: production-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build Verification & Deploy to Production VPS
    runs-on: ubuntu-latest
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline || npm install

      - name: Verify Frontend Production Build
        run: npm run build

      - name: Execute Production Release & Atomic Deployment on VPS via SSH
        if: env.VPS_SSH_KEY != ''
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST || '169.58.111.159' }}
          username: ${{ secrets.VPS_USERNAME || 'altrixadmin' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE || '' }}
          envs: GITHUB_TOKEN
          script: |
            sudo mkdir -p /opt/altrix/scripts /opt/altrix/repo
            sudo git config --global --add safe.directory "*" || true
            if [ -d /opt/altrix/repo/.git ]; then
              cd /opt/altrix/repo
              sudo git remote add altrix2 https://github.com/farhathashmireflections-sys/Altrix-2.git 2>/dev/null || true
              sudo git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/naumanellahidev/AltRix.git" || true
              sudo git fetch origin "${{ github.sha }}" 2>/dev/null || sudo git fetch altrix2 "${{ github.sha }}" 2>/dev/null || sudo git fetch origin main 2>/dev/null || sudo git fetch altrix2 main 2>/dev/null || true
              sudo cp -p /opt/altrix/repo/scripts/deploy.sh /opt/altrix/scripts/deploy.sh 2>/dev/null || true
            fi
            sudo chmod +x /opt/altrix/scripts/deploy.sh 2>/dev/null || true
            sudo GITHUB_TOKEN="${GITHUB_TOKEN}" /opt/altrix/scripts/deploy.sh "${{ github.sha }}"
