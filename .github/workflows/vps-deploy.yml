name: Production VPS Automated CI/CD Deployment

on:
  push:
    branches:
      - main

concurrency:
  group: production-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Execute Production Release & Atomic Deployment on VPS
        if: env.VPS_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST || '169.58.111.159' }}
          username: ${{ secrets.VPS_USERNAME || 'altrixadmin' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            sudo mkdir -p /opt/altrix/scripts /opt/altrix/repo
            sudo git config --global --add safe.directory "*" || true
            if [ -d /opt/altrix/repo/.git ]; then
              cd /opt/altrix/repo
              sudo git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/naumanellahidev/AltRix.git" || true
              sudo git fetch origin "${{ github.sha }}" || sudo git fetch origin main || true
              sudo cp -p /opt/altrix/repo/scripts/deploy.sh /opt/altrix/scripts/deploy.sh 2>/dev/null || true
            fi
            sudo chmod +x /opt/altrix/scripts/deploy.sh 2>/dev/null || true
            sudo GITHUB_TOKEN="${GITHUB_TOKEN}" /opt/altrix/scripts/deploy.sh "${{ github.sha }}"
